# SonarQube Configuration for HM11 Driver
# Documentation: https://docs.sonarsource.com/sonarqube-server/latest/analyzing-source-code/languages/c-family/

# Project identification
sonar.projectKey=hm11-driver
sonar.projectName=HM11 Driver
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=src,include
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# sonar-cxx plugin configuration
sonar.cxx.file.suffixes=.cpp,.hpp,.h,.cc,.cxx
sonar.cxx.includeDirectories=include,src,/usr/include,/usr/local/include
sonar.cxx.errorRecoveryEnabled=true

# Use compilation database for include paths and defines
sonar.cxx.jsonCompilationDatabase=build/sonarqube/compile_commands.json

# Exclude patterns
sonar.exclusions=**/build/**,**/vendor/**,**/.git/**,**/examples/**,**/fuzz/**
sonar.test.exclusions=**/tests/**

# External analyzer reports (optional - use plural 'reportPaths')
# sonar.cxx.clangsa.reportPaths=build/sonarqube/clang-analyzer-report.plist
# sonar.cxx.clangtidy.reportPaths=build/sonarqube/clang-tidy-report.txt
